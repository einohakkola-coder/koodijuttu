<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<title>Tuotteet</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Koodit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="card">
  <nav data-active="1"><a href="/">Lisää</a><a class="active" href="/hae">Hae</a><a href="/koodit">Koodit</a></nav>

  <div class="views" id="views">
    <!-- Lista -->
    <section class="view list-view stagger" id="listView">
      <div>
        <h1>Valitse tuote</h1>
        <p class="sub" id="listSub">Ladataan tuotteita…</p>
      </div>
      <label class="search filter" id="filterWrap" hidden>
        <svg class="search-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="filter" type="search" placeholder="Suodata…" autocomplete="off" aria-label="Suodata tuotteita">
      </label>
      <ul class="products" id="products"></ul>
    </section>

    <!-- Tuotteen koodit -->
    <section class="view detail-view" id="detailView" aria-live="polite">
      <button class="back" id="back" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Tuotteet
      </button>
      <h1 id="dName"></h1>
      <p class="sub" id="dCount"></p>
      <div class="codes" id="dCodes"></div>
      <p class="tip" id="tip">Napauta koodia: se kopioituu ja poistuu.</p>
      <div class="undo" id="undo"><div><span id="undoText"></span><button type="button" id="undoBtn">Kumoa</button></div></div>
    </section>
  </div>
</main>

<script src="/ui.js"></script>
<script>
const listEl = document.getElementById("products");
const listSub = document.getElementById("listSub");
const filterWrap = document.getElementById("filterWrap");
const filterEl = document.getElementById("filter");
const views = document.getElementById("views");
let products = [];

const norm = (s) => s.trim().toLowerCase();
const countText = (n) => `${n} ${n === 1 ? "koodi" : "koodia"}`;

async function load() {
  try {
    const j = await api("/api/code?q=");
    products = j.results.sort((a, b) => a.name.localeCompare(b.name, "fi"));
    if (!products.length) {
      listSub.innerHTML = `Ei vielä tuotteita. <a href="/">Lisää ensimmäinen</a>.`;
      return;
    }
    listSub.textContent = `${products.length} ${products.length === 1 ? "tuote" : "tuotetta"}`;
    filterWrap.hidden = products.length < 6;
    renderList();
  } catch (err) {
    listSub.innerHTML = `<span class="err-text">${esc(err.message)}</span>`;
  }
}

function renderList() {
  const f = norm(filterEl.value);
  if (!products.length) { listEl.innerHTML = ""; return; }
  const shown = products.filter((p) => !f || norm(p.name).includes(f));
  listEl.innerHTML = shown.length
    ? shown.map((p, i) => `
      <li style="animation-delay:${Math.min(i, 12) * 30}ms">
        <button type="button" class="product" data-i="${products.indexOf(p)}">
          <span class="badge">${p.prefix ?? "–"}</span>
          <span class="pname">${esc(p.name)}</span>
          <span class="pcount">${p.codes.length}</span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </li>`).join("")
    : `<li class="empty">Ei tuotteita haulla "${esc(filterEl.value)}".</li>`;
}
filterEl.addEventListener("input", renderList);

listEl.addEventListener("click", (e) => {
  const b = e.target.closest(".product");
  if (b) openProduct(products[+b.dataset.i]);
});

function openProduct(p) {
  document.getElementById("dName").textContent = p.name;
  current = p;
  renderCodes();
  views.classList.add("detail");
  history.pushState({ detail: true }, "");
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function renderCodes() {
  updateDetailCount();
  dCodes.innerHTML = current.codes
    .map((c, i) => `<button type="button" class="code" data-code="${c}" style="animation-delay:${120 + i * 50}ms">${c}</button>`)
    .join("");
}
function closeProduct() {
  listSub.textContent = products.length ? `${products.length} ${products.length === 1 ? "tuote" : "tuotetta"}` : "Ei tuotteita jäljellä.";
  renderList();
  const lv = document.getElementById("listView");
  lv.classList.remove("back-in"); void lv.offsetWidth; lv.classList.add("back-in");
  views.classList.remove("detail");
}

document.getElementById("back").addEventListener("click", () => history.back());
window.addEventListener("popstate", closeProduct);

// Napauta koodia -> kopioi ja poista (kertakäyttöinen)
const dCodes = document.getElementById("dCodes");
const undo = document.getElementById("undo");
const undoText = document.getElementById("undoText");
let current = null, lastUsed = null, undoTimer;

function updateDetailCount() {
  const n = current.codes.length;
  document.getElementById("dCount").textContent = n
    ? countText(n) + (current.prefix ? ` · alkavat numerolla ${current.prefix}` : "")
    : "Kaikki koodit käytetty.";
  document.getElementById("tip").style.visibility = n ? "" : "hidden";
}

dCodes.addEventListener("click", async (e) => {
  const b = e.target.closest(".code");
  if (!b || b.disabled) return;
  const code = b.dataset.code;
  b.disabled = true;
  try { await navigator.clipboard.writeText(code); } catch {}
  b.classList.add("copied"); b.textContent = "Kopioitu";
  try {
    const j = await api("/api/code?code=" + code, { method: "DELETE" });
    current.codes = current.codes.filter((c) => c !== code);
    if (!current.codes.length) products = products.filter((p) => p !== current);
    lastUsed = { code, name: j.name, product: current };
    showUndo(`${code} käytetty`);
    setTimeout(() => {
      b.classList.add("gone");
      setTimeout(() => { b.remove(); updateDetailCount(); }, 350);
    }, 600);
  } catch (err) {
    b.classList.remove("copied"); b.classList.add("used"); b.textContent = code;
    showUndo(err.message, true);
    current.codes = current.codes.filter((c) => c !== code);
    setTimeout(() => { b.classList.add("gone"); setTimeout(() => { b.remove(); updateDetailCount(); }, 350); }, 1200);
  }
});

function showUndo(text, noButton) {
  clearTimeout(undoTimer);
  undoText.textContent = text;
  document.getElementById("undoBtn").hidden = !!noButton;
  undo.classList.add("show");
  undoTimer = setTimeout(() => { undo.classList.remove("show"); lastUsed = null; }, 5000);
}

document.getElementById("undoBtn").addEventListener("click", async () => {
  if (!lastUsed) return;
  const u = lastUsed; lastUsed = null;
  clearTimeout(undoTimer); undo.classList.remove("show");
  try {
    await api("/api/code", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: u.code, name: u.name }) });
    u.product.codes = [...u.product.codes, u.code].sort();
    if (!products.includes(u.product)) products.push(u.product), products.sort((a, b) => a.name.localeCompare(b.name, "fi"));
    if (current === u.product && views.classList.contains("detail")) renderCodes();
  } catch (err) { showUndo(err.message, true); }
});

load();
</script>
</body>
</html>
