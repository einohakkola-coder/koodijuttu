<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hae koodi</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="card">
  <nav><a href="/">Lisää</a><a class="active" href="/hae">Hae</a></nav>
  <h1>Syötä koodi</h1>
  <input id="code" class="code big" inputmode="numeric" maxlength="4" placeholder="0000" autofocus autocomplete="off">
  <div id="result" class="result"></div>
</main>
<script>
const input = document.getElementById("code");
const out = document.getElementById("result");
input.addEventListener("input", async () => {
  input.value = input.value.replace(/\D/g, "").slice(0, 4);
  out.className = "result"; out.textContent = "";
  if (input.value.length !== 4) return;
  out.textContent = "Haetaan…";
  try {
    const r = await fetch("/api/code?code=" + input.value);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Virhe");
    out.className = "result found"; out.textContent = j.name;
  } catch (err) {
    out.className = "result err"; out.textContent = err.message;
  }
});
</script>
</body>
</html>
