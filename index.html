<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<title>Lisää koodi</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Koodit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="card">
  <nav data-active="0"><a class="active" href="/">Lisää</a><a href="/hae">Hae</a><a href="/koodit">Koodit</a></nav>

  <form id="f" class="stagger" autocomplete="off" novalidate>
    <div>
      <h1>Lisää koodi</h1>
      <p class="sub">Liitä tuote nelinumeroiseen koodiin.</p>
    </div>

    <label class="field">
      <span class="label">Tuote</span>
      <input id="name" maxlength="100" placeholder="esim. Maito" list="products" enterkeyhint="next" required autofocus>
      <datalist id="products"></datalist>
    </label>

    <div>
      <span class="label">Koodi <span class="prefix-hint" id="prefixHint"></span></span>
      <div class="pin" id="pin">
        <input inputmode="numeric" autocomplete="one-time-code" maxlength="4" aria-label="Nelinumeroinen koodi">
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      </div>
    </div>

    <label class="toggle">
      <span>Korvaa jos koodi on jo käytössä</span>
      <input type="checkbox" id="overwrite"><span class="sw"></span>
    </label>

    <button class="btn" id="save" type="submit">
      <span class="lbl">Tallenna</span>
      <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </button>

    <div class="toast" id="toast"><div id="toastText"></div></div>
  </form>
</main>

<script src="/ui.js"></script>
<script>
const nameEl = document.getElementById("name");
const btn = document.getElementById("save");
const toast = document.getElementById("toast");
const toastText = document.getElementById("toastText");
let toastTimer;

const prefixHint = document.getElementById("prefixHint");
const pin = Pin(document.getElementById("pin"), {
  onChange: () => hideToast(),
  onComplete: () => { if (!nameEl.value.trim()) nameEl.focus(); },
});
pin.render();

const norm = (s) => s.trim().toLowerCase().replace(/\s+/g, " ");
let prefixes = {}; // tuote -> aloitusnumero

// Ehdotetaan olemassa olevia tuotenimiä ja haetaan niiden aloitusnumerot
async function loadProducts() {
  try {
    const j = await api("/api/code?q=");
    prefixes = {};
    j.results.forEach((r) => { if (r.prefix) prefixes[norm(r.name)] = r.prefix; });
    document.getElementById("products").innerHTML = j.results.map((r) => `<option value="${esc(r.name)}">`).join("");
    updatePrefix();
  } catch {}
}
loadProducts();

function updatePrefix() {
  const d = prefixes[norm(nameEl.value)] || "";
  pin.setPrefix(d);
  prefixHint.textContent = d ? `· alkaa numerolla ${d}` : "";
  prefixHint.classList.toggle("show", !!d);
}
nameEl.addEventListener("input", () => { hideToast(); updatePrefix(); });
nameEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); pin.focus(); } });

function showToast(type, html, autoHide) {
  clearTimeout(toastTimer);
  toast.className = "toast " + type;
  toastText.innerHTML = `<span class="dot"></span>${html}`;
  requestAnimationFrame(() => toast.classList.add("show"));
  if (autoHide) toastTimer = setTimeout(hideToast, 4000);
}
function hideToast() { toast.classList.remove("show"); }

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (pin.value.length !== 4) { pin.state("err"); pin.shake(); pin.focus(); return showToast("err", "Koodissa pitää olla 4 numeroa."); }
  if (!nameEl.value.trim()) { nameEl.classList.add("shake"); setTimeout(() => nameEl.classList.remove("shake"), 400); nameEl.focus(); return showToast("err", "Anna tuotteen nimi."); }

  btn.disabled = true; btn.classList.add("loading"); pin.state("loading"); hideToast();
  try {
    const j = await api("/api/code", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: pin.value, name: nameEl.value, overwrite: document.getElementById("overwrite").checked }),
    });
    btn.classList.remove("loading"); btn.classList.add("done"); pin.state("ok");
    showToast("ok", `Tallennettu <code>${esc(j.code)}</code> → ${esc(j.name)}`, true);
    if (!prefixes[norm(j.name)]) prefixes[norm(j.name)] = j.code[0];
    loadProducts();
    // Tuotenimi jää kenttään, jotta samalle tuotteelle voi lisätä heti seuraavan koodin
    setTimeout(() => {
      btn.classList.remove("done"); btn.disabled = false;
      updatePrefix(); pin.clear(); pin.focus();
    }, 1200);
  } catch (err) {
    btn.classList.remove("loading"); btn.disabled = false;
    if (err.data && err.data.prefix) { prefixes[norm(nameEl.value)] = err.data.prefix; updatePrefix(); }
    pin.state("err"); pin.shake();
    showToast("err", esc(err.message));
  }
});
</script>
</body>
</html>
